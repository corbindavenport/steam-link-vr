## GitHub Action to download and reupload Steam Link VR APK

name: Fetch APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install DepotDownloader
      run: |
        wget "https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-linux-x64.zip"
        unzip "DepotDownloader-linux-x64.zip" -d "downloader"
        chmod +x "downloader/DepotDownloader"
    
    - name: Get APK from stable branch
      run: |
        downloader/DepotDownloader -app 250820 -depot 250824 -filelist filelist.txt -dir "stable"
        mv -f stable/drivers/vrlink/resources/android-steamlinkvr-release.apk ./steamlinkvr-release-stable.apk

    - name: Get APK from beta branch
      run: |
        downloader/DepotDownloader -app 250820 -depot 250824 -filelist filelist.txt -dir "beta" -branch "beta"
        mv -f beta/drivers/vrlink/resources/android-steamlinkvr-release.apk ./steamlinkvr-release-beta.apk

    - name: Commit APKs
      run: |
        git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steamlinkvr-release-stable.apk steamlinkvr-release-beta.apk
          git diff --cached --quiet || git commit -m "Updated Steam Link APKs [skip ci]"
          git push origin HEAD:${{ github.ref_name }}